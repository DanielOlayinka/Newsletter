<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>New Letter</title>
  </head>
  <body>
    <div class="lux">
      <img src="./Images/illustration-sign-up-mobile.svg" alt="" />
    </div>
    <div class="container">
      <div class="box1">
        <h1>Stay updated!</h1>
        <p id="description">
          Join 60,000+ product managers receiving monthly updates on:
        </p>
        <p class="list-item">
          <img src="./Images/icon-success.svg" alt="success" /><img
            src="./Images/icon-list.svg"
            alt=""
          />
          Product discovery and building what matters
        </p>
        <p class="list-item">
          <img src="./Images/icon-success.svg" alt="success" /><img
            src="./Images/icon-list.svg"
            alt=""
          />
          Measuring to ensure updates are a success
        </p>
        <p class="list-item">
          <img src="./Images/icon-success.svg" alt="success" /><img
            src="./Images/icon-list.svg"
            alt=""
          />And much more!
        </p>
        <div class="form">
          <label>
            <div class="email-label">
              <b>Email address</b> <b id="email-error"></b>
            </div>
            <input
              type="email"
              spellcheck="false"
              id="email-field"
              name="email"
              placeholder="email@company.com"
            />
          </label>
          <main>
            <button type="submit" onclick="handleSubmit()">
              Subscribe to monthly newsletter
            </button>
          </main>
       </div>
      </div>
      <div class="box2">
        <img src="./Images/illustration-sign-up-desktop.svg" alt="" />
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
